name: Transport formatting diagnostic
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Format source snapshot for review
        run: |
          node <<'NODE'
          const fs = require("node:fs")
          const { spawnSync } = require("node:child_process")
          const files = ["packages/mcp-server/src/shape-library-catalog.ts","packages/mcp-server/src/bundled-shape-library.ts","packages/mcp-server/src/shape-library.ts","lib/chat-tools.ts","lib/service-response.ts","lib/operations-documents.ts","lib/emc-client-chat.ts","lib/operations-bridge.ts","tests/unit/operations-mobile.test.ts","tests/unit/service-response.test.ts","tests/unit/emc-client-chat.test.ts","tests/e2e/lib/mock-operations-storage.ts","tests/e2e/operations-integration.spec.ts","tests/e2e/source-attachments.spec.ts","tests/fixtures/emc-response.ts"]
          const result = spawnSync("npx", ["biome", "check", "--write", ...files], { encoding: "utf8" })
          process.stdout.write(result.stdout || "")
          process.stderr.write(result.stderr || "")
          for (const path of files) process.stdout.write("FORMATTED_FILE " + JSON.stringify({ path, content: fs.readFileSync(path, "utf8") }) + "\n")
          NODE
